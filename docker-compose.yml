# Full HomeSilo stack: PostgreSQL + API + web UI (nginx).
#
#   cp .env.example .env      # then set DB_PASSWORD and JWT_SECRET
#   docker compose up -d --build
#
# Expects the client repository checked out next to this one (../homesilo-client).
# The UI (and, through it, the API) is published on http://localhost:${HOMESILO_PORT:-8080}.

name: homesilo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homesilo
      POSTGRES_USER: homesilo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homesilo -d homesilo"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/homesilo
      DB_USERNAME: homesilo
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-100GB}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5GB}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-90}
      STORAGE_BASE_PATH: /data/storage
    volumes:
      - storage:/data/storage

  client:
    build: ../homesilo-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://server:8080
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5GB}
    ports:
      - "${HOMESILO_PORT:-8080}:8080"

volumes:
  db-data:
  storage:
