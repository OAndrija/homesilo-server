# HomeSilo: the files you need to run it are this one and .env.example.
#
#   cp .env.example .env     # set DB_PASSWORD
#   docker compose up -d
#
# Then open http://<this machine>:8080 and follow the setup page. To reach
# HomeSilo from outside your home, add one of the overlays in this folder;
# see docs/remote-access.md.

name: homesilo

x-logging: &logging
  # Docker keeps container logs forever by default; this caps them at 30 MB each.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homesilo
      POSTGRES_USER: homesilo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homesilo -d homesilo"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  server:
    image: ghcr.io/oandrija/homesilo-server:${HOMESILO_VERSION:-1}
    restart: unless-stopped
    # Java sizes its heap from this (three quarters of it). Raise it if thumbnails
    # of big PDFs fail or the log mentions OutOfMemoryError.
    mem_limit: ${HOMESILO_MEMORY:-1g}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/homesilo
      DB_USERNAME: homesilo
      DB_PASSWORD: ${DB_PASSWORD}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SETUP_CODE: ${SETUP_CODE:-}
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-100GB}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5GB}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 0 2 * * *}
    volumes:
      - files:/data/storage
      # Previews of images and documents. Safe to delete; they're made again.
      - thumbnails:/data/thumbnails
      # Nightly database backups. See docs/backups.md for copying them off this machine.
      - backups:/data/backups
    logging: *logging

  client:
    image: ghcr.io/oandrija/homesilo-client:${HOMESILO_VERSION:-1}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://server:8080
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5GB}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-}
    ports:
      # HOMESILO_BIND=127.0.0.1 keeps it off your home network, e.g. when
      # everyone comes in through a tunnel.
      - "${HOMESILO_BIND:-0.0.0.0}:${HOMESILO_PORT:-8080}:8080"
    logging: *logging

networks:
  default:
    ipam:
      config:
        # A fixed range, so the overlays can tell nginx to trust exactly the
        # proxy containers on it. Change it if it clashes with your network.
        - subnet: ${HOMESILO_SUBNET:-172.30.80.0/24}

volumes:
  db:
  files:
  thumbnails:
  backups:
