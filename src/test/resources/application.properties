spring.application.name=homesilo-server-test

# The database is a PostgreSQL container from TestcontainersConfiguration (same
# version as docker-compose.yml); its connection details are wired in automatically.
# The real Flyway migrations run against it and Hibernate validates the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

homesilo.jwt.secret=test-secret-that-is-definitely-longer-than-32-bytes
homesilo.jwt.expiration=1h
homesilo.storage.base-path=target/test-storage
homesilo.storage.thumbnail-path=target/test-thumbnails
homesilo.trash.retention-days=30
homesilo.auth.max-login-attempts=3
# Most tests sign people up freely; FirstRunIntegrationTest covers the invite-only default.
homesilo.auth.registration-enabled=true
homesilo.auth.setup-code=TEST-SETUP-CODE-0001

spring.mvc.problemdetails.enabled=true
