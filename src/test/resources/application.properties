spring.application.name=homesilo-server-test

# In-memory H2 in PostgreSQL mode; the real Flyway migrations run against it and
# Hibernate validates the entities against the result.
spring.datasource.url=jdbc:h2:mem:homesilo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

homesilo.jwt.secret=test-secret-that-is-definitely-longer-than-32-bytes
homesilo.jwt.expiration=1h
homesilo.storage.base-path=target/test-storage
homesilo.trash.retention-days=30
homesilo.auth.max-login-attempts=3

spring.mvc.problemdetails.enabled=true
