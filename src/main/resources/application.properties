spring.application.name=homesilo-server

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homesilo}
spring.datasource.username=${DB_USERNAME:homesilo}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Existing databases created by `ddl-auto=update` have no Flyway history yet:
# baseline them at version 0 so the idempotent V1 runs against them safely.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── HomeSilo ──────────────────────────────────────────────────────────────────
homesilo.jwt.secret=${JWT_SECRET}
homesilo.jwt.expiration=${JWT_EXPIRATION:7d}
homesilo.auth.cookie-secure=${COOKIE_SECURE:false}
homesilo.auth.registration-enabled=${REGISTRATION_ENABLED:true}
homesilo.storage.base-path=${STORAGE_BASE_PATH:./data/storage}
homesilo.storage.default-quota=${DEFAULT_QUOTA:100GB}
homesilo.storage.thumbnail-path=${THUMBNAIL_PATH:./data/thumbnails}
homesilo.trash.retention-days=${TRASH_RETENTION_DAYS:30}
homesilo.activity.retention-days=${ACTIVITY_RETENTION_DAYS:90}
homesilo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Web ───────────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:5GB}
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=200
# Trust X-Forwarded-* from the bundled nginx (private-network proxies only).
server.forward-headers-strategy=native
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
# Large downloads/zips can take a while on slow links.
spring.mvc.async.request-timeout=-1

# ── Operations ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.com.andrija.homesiloserver=INFO
