# Publishes a release when a version tag (v1.2.3) is pushed: tests, then the
# server image for amd64 and arm64 on GHCR, then a GitHub release with the
# notes from CHANGELOG.md. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # A dry run (everything except publishing) whenever what it builds changes,
    # so a broken arm64 build shows up before release day. Tags ignore paths.
    branches: ["**"]
    paths:
      - Dockerfile
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/oandrija/homesilo-server

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check the tag matches the version in pom.xml
        if: github.ref_type == 'tag'
        run: |
          pom=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$pom" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but pom.xml says $pom. Run scripts/set-version.sh first."
            exit 1
          fi

      - name: Test
        run: mvn -B verify

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=HomeSilo server
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.description=The API and storage behind HomeSilo, a self-hosted file drive

      # Scanned before anything is published: a known, fixable, serious vulnerability stops the release.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homesilo-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress homesilo-server:scan

      - id: push
        name: Build and publish (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "HomeSilo ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
